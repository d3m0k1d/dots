
background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}
#Date
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %d %B")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 320
  halign = center
  valign = center
}
#Time
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%I:%M %p")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 50
  font_family = JetBrains Mono
  position = 0, 375
  halign = center
  valign = center
}
image {
    monitor =
    path = /home/d3m0k1d/dots/.config/hypr/ava.jpg
    size = 140
    border_size = 1
    position = 0, 200
    halign = center
    valign = center
}

label {
  monitor =
  text = $USER
  color = rgba(255, 255, 255, 1)
  font_size = 30
  font_family = JetBrains Mono
  position = 0, 100
  halign = center
  valign = center
}

input-field {
    monitor =
    size = 250, 60
    font_size = 20
    font_family = JetBrains Mono
    fade_on_empty = false
    rounding = -1
    placeholder_text = <i><span foreground="black">Input Password...</span></i>
    position = 0, 0
    halign = center
    valign = center
}

